name: Android Build
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEY_BASE64:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Free space for project SDK
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv CLI
        run: |
          nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222#devenv
          printf '%s\n' "${XDG_STATE_HOME:-$HOME/.local/state}/nix/profiles/profile/bin" "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Install dependencies and Rust target
        run: |
          devenv shell -- lanpath-install
          devenv shell -- lanpath-rust-targets
      - name: Build branded Go AAR
        run: devenv shell -- lanpath-build-aar
      - name: Configure release signing
        if: inputs.release
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          devenv shell -- python3 scripts/configure-android-signing.py
      - name: Build Android
        run: |
          if [ '${{ inputs.release }}' = 'true' ]; then
            devenv shell -- lanpath-build-android-release
          else
            devenv shell -- lanpath-build-android-debug
          fi
      - name: Verify and stage APK
        env:
          RELEASE_BUILD: ${{ inputs.release }}
        run: devenv shell -- bash scripts/stage-android-apk.sh
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: lanpath-android-${{ inputs.release && 'release' || 'debug' }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always() && inputs.release
        run: |
          rm -f "$RUNNER_TEMP/lanpath-release.p12" apps/client/src-tauri/gen/android/keystore.properties
