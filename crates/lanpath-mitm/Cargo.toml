[package]
name = "lanpath-mitm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
lanpath-common = { workspace = true }
lanpath-script = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
rcgen = "0.14"
# rcgen 0.14 的 not_before / not_after 使用 time::OffsetDateTime（rcgen 不 re-export）。
time = "0.3"
hudsucker = { path = "../../vendor/hudsucker", default-features = false, features = ["rcgen-ca", "rustls-client", "http2"] }
http = "1"
http-body-util = { workspace = true }
futures = { workspace = true }
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
sha2 = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true }
webpki-roots = "0.26"
http-body = "1"
flate2 = "1"
brotli = "8"
x509-parser = { version = "0.18", features = ["verify"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
