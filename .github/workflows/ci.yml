name: Client CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Free space for project SDK
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Install dependencies
        run: nix develop --option substituters https://cache.nixos.org --option extra-substituters "" --command bun install --frozen-lockfile
      - name: Install project Rust targets
        run: nix develop --option substituters https://cache.nixos.org --option extra-substituters "" --command rustup target add aarch64-linux-android
      - name: Frontend verification
        run: |
          nix develop --option substituters https://cache.nixos.org --option extra-substituters "" --command bun run --filter lanpath-app verify
          nix develop --option substituters https://cache.nixos.org --option extra-substituters "" --command bun run --filter @lanpath/client-core verify
          nix develop --option substituters https://cache.nixos.org --option extra-substituters "" --command bun run --filter @lanpath/ui verify
      - name: Rust build and gates
        run: |
          nix develop --option substituters https://cache.nixos.org --option extra-substituters "" --command cargo build --workspace
          nix develop --option substituters https://cache.nixos.org --option extra-substituters "" --command bun run verify:rust
      - name: Portable and release tooling tests
        run: nix develop --option substituters https://cache.nixos.org --option extra-substituters "" --command bun test apps/client/scripts/package-portable.test.ts scripts/release-manifest.test.ts scripts/verify-release-signatures.test.ts
  android:
    uses: ./.github/workflows/android-build.yml
    with:
      release: false
