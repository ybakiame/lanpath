[package]
name = "lanpath-desktop-experimental"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Lanpath and ProxyPanel Contributors"]
repository = "https://github.com/ybakiame/lanpath"
rust-version = "1.92"
publish = false

[dependencies]
chrono = "0.4"
futures = "0.3"
gpui-kit = "0.7.3"
lanpath-client = { path = "../../crates/lanpath-client", default-features = false, features = ["mitm", "scripts"] }
lanpath-common = { path = "../../crates/lanpath-common" }
lanpath-engine = { path = "../../crates/lanpath-engine" }
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Windows 实验性并行目标；不进入根 workspace、Android 或现行发布/CI 门禁。
[workspace]

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
