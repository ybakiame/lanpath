name: GPUI Signed Windows Distribution

on:
  push:
    tags: ['gpui-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-independent-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
            msvc: amd64
          - target: aarch64-pc-windows-msvc
            arch: aarch64
            msvc: amd64_arm64
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Read managed core Go toolchain pin
        id: managed-core-go
        shell: pwsh
        run: |
          $source = Get-Content -Raw apps/gpui/managed-core/source.json | ConvertFrom-Json
          "version=$($source.go_version.Substring(2))" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.managed-core-go.outputs.version }}
          cache: false
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
          vsversion: '2022'
          toolset: '14.44.35207'
          sdk: '10.0.26100.0'
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'
      - name: Check independent version and packaging regressions
        id: product
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/gpui/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "gpui-v$version") { throw 'GPUI tag/package version mismatch' }
          "version=$version" >> $env:GITHUB_OUTPUT
          bun test apps/gpui/tools
          if ($LASTEXITCODE -ne 0) { throw 'GPUI packaging regressions failed' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gpui
          key: gpui-${{ matrix.target }}
      - name: Build independent GPUI executable
        run: cargo build --manifest-path apps/gpui/Cargo.toml --locked --release --target '${{ matrix.target }}' --bin lanpath-gpui
      - name: Create signed dual-data-mode ZIP bundle
        shell: pwsh
        env:
          GPUI_PRIVATE_KEY_PEM: ${{ secrets.GPUI_SIGNING_PRIVATE_KEY_PKCS8 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GPUI_PRIVATE_KEY_PEM)) { throw 'Independent GPUI signing secret is required; unsigned fallback forbidden' }
          $key = Join-Path $env:RUNNER_TEMP "gpui-signing-$([guid]::NewGuid()).pem"
          try {
            [IO.File]::WriteAllText($key, $env:GPUI_PRIVATE_KEY_PEM, [Text.UTF8Encoding]::new($false))
            $env:GPUI_PRIVATE_KEY_PEM = ''
            $env:GPUI_SIGNING_PRIVATE_KEY_FILE = $key
            bun apps/gpui/tools/package.ts all '${{ matrix.target }}'
            if ($LASTEXITCODE -ne 0) { throw 'Signed GPUI packaging failed' }
          } finally {
            Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
          }
      - name: Verify signed consumer bundle before artifact upload
        shell: pwsh
        run: |
          $dir = 'apps/gpui/target/${{ matrix.target }}/release/bundle/gpui'
          $artifact = 'LanpathGPUI_${{ steps.product.outputs.version }}_windows_${{ matrix.arch }}-portable.zip'
          bun apps/gpui/tools/verify.ts verify '${{ matrix.arch }}' "$dir/gpui-${{ matrix.arch }}.json" "$dir/$artifact"
          if ($LASTEXITCODE -ne 0) { throw 'Signed GPUI consumer verification failed' }
      - uses: actions/upload-artifact@v5
        with:
          name: gpui-windows-${{ matrix.arch }}
          path: |
            apps/gpui/target/${{ matrix.target }}/release/bundle/gpui/LanpathGPUI_${{ steps.product.outputs.version }}_windows_${{ matrix.arch }}-portable.zip
            apps/gpui/target/${{ matrix.target }}/release/bundle/gpui/gpui-${{ matrix.arch }}.json
            apps/gpui/target/${{ matrix.target }}/release/bundle/gpui/gpui-${{ matrix.arch }}.json.sig
            apps/gpui/target/${{ matrix.target }}/release/bundle/gpui/GPUI-SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/gpui-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv CLI
        run: |
          nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222#devenv
          printf '%s\n' "${XDG_STATE_HOME:-$HOME/.local/state}/nix/profiles/profile/bin" "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - run: devenv shell -- bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          pattern: gpui-windows-*
          path: gpui-dist
      - name: Verify consumer artifacts before publication
        shell: bash
        run: |
          devenv shell -- bash -euo pipefail <<'VERIFY'
          version="${GITHUB_REF_NAME#gpui-v}"
          for arch in x86_64 aarch64; do
            dir="gpui-dist/gpui-windows-$arch"
            bun apps/gpui/tools/verify.ts verify "$arch" "$dir/gpui-$arch.json" "$dir/LanpathGPUI_${version}_windows_${arch}-portable.zip"
          done
          VERIFY
      - name: Publish dedicated version and channel only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#gpui-v}"
          release_precedence="${release_version%%+*}"
          release_flags=()
          if [[ "$release_precedence" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false "${release_flags[@]}" --title "Lanpath GPUI ${GITHUB_REF_NAME#gpui-v}" --generate-notes gpui-dist/gpui-windows-*/*-portable.zip gpui-dist/gpui-windows-*/gpui-x86_64.json gpui-dist/gpui-windows-*/gpui-x86_64.json.sig gpui-dist/gpui-windows-*/gpui-aarch64.json gpui-dist/gpui-windows-*/gpui-aarch64.json.sig
          for arch in x86_64 aarch64; do
            cp "gpui-dist/gpui-windows-$arch/GPUI-SHA256SUMS.txt" "gpui-dist/GPUI-SHA256SUMS-$arch.txt"
          done
          gh release upload "$GITHUB_REF_NAME" gpui-dist/GPUI-SHA256SUMS-*.txt
          # A prerelease is an explicit download, never a stable-channel promotion.
          if [[ "$release_precedence" != *-* ]]; then
            if ! gh release view gpui-latest >/dev/null 2>&1; then
              gh release create gpui-latest --target "$GITHUB_SHA" --prerelease --latest=false --title 'Lanpath GPUI independent update channel' --notes 'Signed GPUI manifests only; not the Tauri update channel.'
            fi
            gh release upload gpui-latest --clobber gpui-dist/gpui-windows-*/gpui-x86_64.json gpui-dist/gpui-windows-*/gpui-x86_64.json.sig gpui-dist/gpui-windows-*/gpui-aarch64.json gpui-dist/gpui-windows-*/gpui-aarch64.json.sig
          fi
