<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>岚径 · Lanpath</title>
    <link rel="icon" type="image/svg+xml" href="/brand/lanpath.svg" />
    <script>
      // 主题预置（首帧前执行，避免闪变）：与 @lanpath/client-core theme 模块的存储键/
      // 值域一致（pp-ui-theme：light / dark / system，默认 system 跟随系统；存量
      // 历史键 heroui-theme 回退读取，模块加载时一次性迁移）。单文件单脚本服务
      // 双端（合并后不再与具体 UI 库耦合），React 挂载后由 ThemeProvider 接管。
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("pp-ui-theme") || localStorage.getItem("heroui-theme");
        } catch (e) {
          /* 存储不可用：按无记录处理 */
        }
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved = stored === "light" || stored === "dark" ? stored : systemDark ? "dark" : "light";
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute("data-theme", resolved);
        // Vite 在两种构建中注入 MODE，首帧形态与编译期平台保持一致。
        var mobile = "%MODE%" === "android";
        var accent = mobile ? "iris" : "blue";
        var style = "ios";
        try {
          var savedAccent = localStorage.getItem("lanpath-ui-accent");
          if (["iris", "teal", "rose", "blue"].includes(savedAccent)) accent = savedAccent;
          if (localStorage.getItem("pp-ui-style") === "material") style = "material";
        } catch (e) {
          /* 存储不可用时使用平台默认外观。 */
        }
        document.documentElement.dataset.accent = accent;
        if (mobile) document.documentElement.dataset.uiStyle = style;
      })();
    </script>
  </head>
  <!-- 双端共用 @lanpath/ui 语义令牌，平台呈现由编译期常量决定。 -->
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
