product.backup.rollback_hint: "回滚备份已加密保存在本数据根 backup-history/；若新配置异常可据此还原。"
product.backup.ack_hint: "确认后才清除恢复标记；恢复后的配置已在正常使用。"
product.backup.failed_hint: "原配置未被修改；处理后可重新导入备份，或联系支持。"
