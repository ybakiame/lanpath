[package]
name = "lanpath-desktop-experimental"
version = "0.2.0-rc.1"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Lanpath and ProxyPanel Contributors"]
repository = "https://github.com/ybakiame/lanpath"
rust-version = "1.92"
publish = false

[[bin]]
name = "lanpath-gpui"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
chrono = "0.4"
futures = "0.3"
gpui-kit = "0.7.3"
lanpath-client = { path = "../../crates/lanpath-client", default-features = false, features = ["mitm", "scripts"] }
lanpath-common = { path = "../../crates/lanpath-common" }
lanpath-engine = { path = "../../crates/lanpath-engine" }
lanpath-mitm = { path = "../../crates/lanpath-mitm" }
lanpath-script = { path = "../../crates/lanpath-script" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
semver = "1"
sha2 = "0.10"
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
winres = "=0.1.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_NetworkManagement_WindowsFirewall"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Devices_DeviceAndDriverInstallation"] }

# Windows 实验性并行目标；不进入根 workspace、Android 或现行发布/CI 门禁。
[workspace]

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
