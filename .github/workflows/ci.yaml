name: Client CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Free space for project SDK
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv CLI
        run: |
          nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222#devenv
          printf '%s\n' "${XDG_STATE_HOME:-$HOME/.local/state}/nix/profiles/profile/bin" "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: devenv shell -- lanpath-install
      - name: Install project Rust targets
        run: devenv shell -- lanpath-rust-targets
      - name: Frontend verification
        run: devenv shell -- lanpath-verify-frontend
      - name: Rust build and gates
        run: devenv shell -- lanpath-verify-rust
      - name: Runtime cache, Portable and release tooling tests
        run: devenv shell -- lanpath-test-tools
  android:
    uses: ./.github/workflows/android-build.yaml
    with:
      release: false
