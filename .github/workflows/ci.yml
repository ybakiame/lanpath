name: Client CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile
      - name: Install project Rust targets
        run: nix develop --command rustup target add aarch64-linux-android
      - name: Frontend verification
        run: |
          nix develop --command bun run --filter lanpath-app verify
          nix develop --command bun run --filter @lanpath/client-core verify
          nix develop --command bun run --filter @lanpath/ui verify
      - name: Rust build and gates
        run: |
          nix develop --command cargo build --workspace
          nix develop --command bun run verify:rust
      - name: Build branded Go AAR
        run: nix develop --command bash apps/client/scripts/build-lanpath-core.sh
      - name: Android debug build
        working-directory: apps/client
        run: nix develop ../.. --command bun run tauri android build --debug --target aarch64
