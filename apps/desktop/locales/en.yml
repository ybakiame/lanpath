app.title: Lanpath NSH Desktop
app.tagline: Pure Rust · NSH 0.5.0 · Network access only for subscription add/refresh and core query/download; the core validates and starts in user-mode loopback only, the system proxy is taken over and precisely restored by an independent guardian (Windows only), TUN/VPN is never touched

